<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>review-mate</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --panel2:#1c2030; --line:#272b3a; --line2:#33384a; --fg:#e6e8ee;
    --fg2:#9aa3b2; --accent:#6ea8fe; --add:#10301f; --addln:#1f5135; --addfg:#9be8bf;
    --del:#34141a; --delln:#5a2230; --delfg:#f3aab4; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --ok:#3ddc84; --warn:#d0a24a; --warnfg:#f0c88a; --warnbg:rgba(208,162,74,.1); --warnline:#7a5a2a;
    --stalebg:#5a3a1a; --stalefg:#f0c890;
    --purple:#c9a2ef; --purpleln:#a56ef0; --purplebg:rgba(201,162,239,.28);
    --accentline:#3a4a6b; --accentbg:rgba(110,168,254,.13); --accentborder:rgba(110,168,254,.4);
    --accentglow:rgba(110,168,254,.22); --fg2bg:rgba(154,163,178,.08);
    --postline:#2e6b45; --delline:#6b2e38; --usermsgbg:#1d2a44;
    --tokcmt:#7f8aa3; --tokstr:#8fdcb0; --toknum:#e0b892; --shadow:rgba(0,0,0,.55);
  }
  :root[data-theme="light"]{
    --bg:#ffffff; --panel:#f6f8fa; --panel2:#eaeef2; --line:#d0d7de; --line2:#afb8c1; --fg:#1b1f24;
    --fg2:#59636e; --accent:#0969da; --add:#dafbe1; --addln:#aceebb; --addfg:#116329;
    --del:#ffebe9; --delln:#ffc1ba; --delfg:#82071e;
    --ok:#1a7f37; --warn:#9a6700; --warnfg:#7d4e00; --warnbg:rgba(154,103,0,.12); --warnline:#d4a72c;
    --stalebg:#fff8c5; --stalefg:#7d4e00;
    --purple:#8250df; --purpleln:#6639ba; --purplebg:rgba(130,80,223,.16);
    --accentline:#c3d2e8; --accentbg:rgba(9,105,218,.08); --accentborder:rgba(9,105,218,.35);
    --accentglow:rgba(9,105,218,.18); --fg2bg:rgba(89,99,110,.08);
    --postline:#1a7f37; --delline:#cf222e; --usermsgbg:#ddf4ff;
    --tokcmt:#6e7781; --tokstr:#116329; --toknum:#953800; --shadow:rgba(0,0,0,.16);
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .brand{font-weight:600;white-space:nowrap;color:inherit;text-decoration:none} header .mr{color:var(--fg2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .mr .mrlink{color:var(--accent);text-decoration:none} header .mr .mrlink:hover{text-decoration:underline}
  /* the agent light: is Claude watching, and is it working on something of yours right now? */
  header .agent{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:default}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--line2);display:inline-block;flex:none}
  header .agent .alab{font-size:11px;color:var(--fg2);font-family:var(--mono)}
  header .agent .alab:empty{display:none}
  header .agent.watching .dot{background:#3ddc84}
  header .agent.working .dot{background:#d0a24a;animation:apulse 1.1s ease-in-out infinite}
  header .agent.working .alab{color:#f0c88a}
  header .agent.stalled .dot{background:var(--delln);animation:apulse 1.1s ease-in-out infinite}
  header .agent.stalled .alab{color:var(--delfg)}
  /* the inline "still waiting" line, in the chat thread and under an escalated highlight */
  .agentwait{display:flex;align-items:center;gap:7px;padding:6px 0;font-size:11.5px;color:var(--fg2)}
  .agentwait .spin{width:9px;height:9px;flex:none;border-radius:50%;border:1.5px solid var(--line2);
                   border-top-color:var(--accent);animation:aspin .8s linear infinite}
  .agentwait.stalled{color:var(--delfg)}
  .agentwait.stalled .spin{border-color:var(--delln);border-top-color:var(--delln);animation:none}
  .agentwait.mini{padding:0;gap:5px;font-size:11px}
  .agentwait.mini .spin{width:7px;height:7px;border-width:1.5px}
  @keyframes aspin{to{transform:rotate(360deg)}}
  @keyframes apulse{0%,100%{opacity:1}50%{opacity:.2}}
  header .sid{color:var(--fg2);font-family:var(--mono);font-size:11px}
  .tb{display:flex;align-items:center;gap:6px}
  .tb input{background:var(--bg);border:1px solid var(--line2);color:var(--fg);border-radius:6px;padding:5px 9px;font:inherit;width:260px}
  .tb input::placeholder{color:var(--fg2)}
  button.btn{font:inherit;font-size:12.5px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);border-radius:6px;padding:5px 9px;cursor:pointer;white-space:nowrap}
  button.btn:hover{border-color:var(--accent)} button.btn.on{border-color:var(--accent);color:var(--accent)}
  .shell{display:grid;grid-template-columns:240px 1fr 360px;height:calc(100% - 47px);transition:grid-template-columns .12s}
  .shell.hl{grid-template-columns:0 1fr 360px} .shell.hr{grid-template-columns:240px 1fr 0} .shell.hl.hr{grid-template-columns:0 1fr 0}
  .files,.rail{overflow:auto;background:var(--panel)} .files{border-right:1px solid var(--line)} .rail{border-left:1px solid var(--line);padding:12px}
  /* collapse in place — never display:none (that drops the panel from the grid and shifts the diff) */
  .shell.hl .files,.shell.hr .rail{overflow:hidden;border:0;padding:0}
  .diff{overflow:auto;padding:0 0 60px}
  /* file tree */
  .treehdr{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:11px;color:var(--fg2);border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
  .tree{padding:6px 0;font-size:13px}
  .node.file.nodiff{color:var(--fg2)} .node.file.nodiff .ct{color:var(--line2)}
  .node{display:flex;align-items:center;gap:5px;padding:3px 10px;cursor:pointer;white-space:nowrap}
  .node:hover{background:var(--panel2)}
  .node.file.on{background:var(--panel2);color:var(--accent)}
  .node .tw{display:inline-block;width:0;color:var(--fg2)}
  .node .chev{width:11px;color:var(--fg2);transition:transform .1s} .node.dir.closed .chev{transform:rotate(-90deg)}
  .node .ct{font-family:var(--mono);font-size:10px;color:var(--fg2);width:11px;text-align:center}
  .node .ct.added{color:var(--addfg)} .node .ct.deleted{color:var(--delfg)} .node .ct.renamed{color:var(--accent)}
  .children.closed{display:none}
  /* diff */
  .fname{padding:12px 16px 6px;font-family:var(--mono);font-size:12px;color:var(--fg2);display:flex;align-items:center;gap:10px}
  .fname .fnbtn{margin-left:auto;font-size:11px;padding:1px 7px;flex:none}
  .fname .renamed{cursor:help}   /* the braces are terse — the title spells the move out */
  .mdview{padding:14px 20px;overflow:auto;line-height:1.55;max-width:900px}
  .sincenote{margin:10px 14px 0;padding:6px 10px;font-size:11.5px;color:#f0c88a;background:rgba(208,162,74,.1);border:1px solid #7a5a2a;border-radius:6px}
  table.hunk{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
  table.hunk td{padding:0 8px;white-space:pre-wrap;word-break:break-word;vertical-align:top}
  td.ln{min-width:42px;white-space:nowrap;word-break:normal;text-align:right;color:var(--fg2);user-select:none;border-right:1px solid var(--line);background:var(--panel)}
  tr.add td.code{background:var(--add);color:var(--addfg)} tr.add td.ln{background:var(--addln)}
  tr.del td.code{background:var(--del);color:var(--delfg)} tr.del td.ln{background:var(--delln)}
  tr.hh td{color:var(--accent);background:var(--panel2)}
  tr.expand td{background:var(--panel2);color:var(--fg2);user-select:none} tr.expand td.ln{color:var(--accent)}
  tr.expand .exlink{cursor:pointer;color:var(--accent)} tr.expand .exlink:hover{text-decoration:underline}
  /* per-commit review */
  .commitbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  .commitbar .cpos{font-size:12px;color:var(--fg2);white-space:nowrap}
  .commitbar .csel{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);color:var(--fg);border-radius:6px;padding:4px 8px;font:inherit;font-size:12px}
  .commitmsg{padding:10px 14px;border-bottom:1px solid var(--line)}
  .commitmsg .ct{font-weight:600;font-size:13px} .commitmsg .cb{margin-top:4px;color:var(--fg2);font-family:var(--mono);font-size:12px;white-space:pre-wrap}
  tr.line td.code{cursor:pointer} tr.line:hover td.code{outline:1px solid var(--accent);outline-offset:-1px}
  tr.hl td.code{box-shadow:inset 3px 0 0 var(--accent)}
  tr.thl td.code{box-shadow:inset -3px 0 0 #c9a2ef}                    /* a host discussion anchors here */
  tr.hl.thl td.code{box-shadow:inset 3px 0 0 var(--accent), inset -3px 0 0 #c9a2ef}   /* both */
  tr.flash td.code{background:rgba(201,162,239,.28)}                    /* jumped-to discussion line */
  .tok-cmt{color:#7f8aa3;font-style:italic} .tok-str{color:#8fdcb0} .tok-num{color:#e0b892} .tok-kw{color:#c9a2ef}
  td.gap{background:var(--bg)}
  /* split-mode cell colouring (cells carry their own classes) */
  td.code.delc{background:var(--del);color:var(--delfg)} td.ln.delln{background:var(--delln)}
  td.code.addc{background:var(--add);color:var(--addfg)} td.ln.addln{background:var(--addln)}
  td.code.hlc{box-shadow:inset 3px 0 0 var(--accent)}
  /* rail — a compact, filterable index of highlights */
  .rail h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin:6px 0 8px}
  .railtools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .railtools .seg{display:flex;gap:4px;flex-wrap:wrap}
  .railtools .seg button.btn{font-size:11px;padding:3px 7px}
  .railtools input{flex:1;min-width:100px;background:var(--bg);border:1px solid var(--line2);color:var(--fg);border-radius:6px;padding:5px 8px;font:inherit;font-size:12px}
  .railtools input::placeholder{color:var(--fg2)}
  .hrow{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 26px 8px 10px;margin-bottom:7px;cursor:pointer}
  .hrow:hover{border-color:var(--line2)}
  .hrow.active{border-color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
  .hrow.agent{border-color:#3a4a6b}
  .hrow.resolved{background:var(--add);border-color:var(--addln)}   /* a resolved discussion, at a glance */
  .hrow.resolved.active{border-color:var(--accent)}
  .hrow .top{display:flex;align-items:center;gap:6px;margin-bottom:3px;min-width:0}
  .hrow .num{font-family:var(--mono);font-size:10.5px;color:var(--fg2)}
  .hrow .loc{font-family:var(--mono);font-size:10.5px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  /* a location that jumps the diff to its line — on an index row or in the detail header alike */
  .jumpcode{cursor:pointer;text-decoration:underline dotted} .jumpcode:hover{color:var(--fg)}
  .detail .dlabel.jumpcode{font-family:var(--mono);color:var(--accent)}
  .hrow .prev{color:var(--fg2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hrow .x{position:absolute;right:6px;top:6px;color:var(--fg2);cursor:pointer;border:none;background:none;font-size:15px;line-height:1;padding:2px}
  .hrow .x:hover{color:var(--delfg)}
  .chip{flex:none;font-size:9px;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:1px 5px;border:1px solid var(--line2);color:var(--fg2)}
  .chip.comment{color:var(--accent);border-color:#3a4a6b} .chip.posted{color:var(--addfg);border-color:#2e6b45}
  .chip.insight{color:var(--accent);border-color:#3a4a6b}
  .hrow.mr{background:var(--panel);border-style:dashed} .hrow.mr.active{border-style:solid}
  .detail .dlabel{font-size:12px;color:var(--fg2)}
  .reviewbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:10px;font-size:12.5px;color:var(--fg2)}
  .reviewbar.sticky{position:sticky;top:0;z-index:3}
  .reviewbar .approve-tog{display:inline-flex;align-items:center;gap:4px;margin-left:auto;white-space:nowrap;cursor:pointer;user-select:none}
  .reviewbar .approve-tog input{cursor:pointer}
  .reviewbar .chip.you-approved{margin-left:auto;font-size:10px;padding:2px 7px}   /* right-aligned status marker */
  button.btn.primary{border-color:var(--accent);color:var(--accent)}
  /* detail overlay — non-blocking: floats over the diff, leaves the rail clickable */
  .detail{position:fixed;top:60px;right:384px;width:clamp(380px,46vw,640px);max-height:calc(100vh - 84px);overflow:auto;
    background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 16px 48px rgba(0,0,0,.55);padding:14px 16px;z-index:40}
  .detail[hidden]{display:none}
  .detail .dhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .detail .dhead .num{font-family:var(--mono);font-size:11px;color:var(--fg2);background:var(--bg);border:1px solid var(--line2);border-radius:5px;padding:0 5px}
  .detail .dhead .loc{font-family:var(--mono);font-size:12px;color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .detail .byclaude{display:inline-block;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);border:1px solid #3a4a6b;border-radius:5px;padding:0 5px}
  .detail .dclose{margin-left:auto;flex:none;color:var(--fg2);border:none;background:none;font-size:18px;line-height:1;cursor:pointer;padding:2px 4px}
  .detail .dclose:hover{color:var(--fg)}
  .detail .q{color:var(--fg2);font-size:12.5px;margin-bottom:8px}
  .detail .card{white-space:pre-wrap}
  .cheapctx{margin:0 0 10px;font-size:12px;color:var(--fg2)}
  .cheapctx .ctxrow{padding:5px 0;border-bottom:1px solid var(--line)} .cheapctx .ctxrow:last-child{border-bottom:0}
  .cheapctx .k{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-right:6px}
  .cheapctx .s{color:var(--fg);margin-top:2px}
  .askctx{display:flex;gap:6px;margin:0 0 10px} .askctx .askinp{flex:1;min-width:0}
  .suglbl{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:6px 0 3px}
  .suggbox{font-family:var(--mono,monospace);white-space:pre}
  .yourthread{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg2);margin:4px 0}
  .msg .noteacts{margin-top:3px;display:flex;gap:6px} .msg .noteacts .btn{font-size:10px;padding:0 4px}
  .hrow .btn.jump{margin-left:auto;font-size:10px;padding:0 5px}
  .verbanner{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(110,168,254,.13);border:1px solid rgba(110,168,254,.4);border-left:3px solid var(--accent);border-radius:8px;padding:9px 12px;margin-bottom:10px;font-size:12px}
  .verbanner .vblabel{font-weight:600;color:var(--fg);display:flex;align-items:center;gap:7px}
  .verbanner .vblabel::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(110,168,254,.22);flex:none}
  .verbanner.baseline{background:rgba(154,163,178,.08);border-color:var(--line2);border-left-color:var(--line2)}
  .verbanner.baseline .vblabel{color:var(--fg2);font-weight:500} .verbanner.baseline .vblabel::before{background:var(--fg2);box-shadow:none}
  .chip.stale{background:#5a3a1a;color:#f0c890;border-color:#7a5a2a}
  .verbanner .vbctl{display:flex;gap:6px} .btn.on{background:var(--accent,#4a6bd0);color:#fff}
  /* rebase-aware interdiff (git range-diff), dual-column (old|new) split — conflict fallback only */
  .rdiff{font-family:var(--mono,monospace);font-size:12px;line-height:1.55;overflow-x:auto;padding:6px 0}
  .rdiff .rdlegend{font-family:var(--sans,inherit);font-size:10.5px;color:var(--fg2);padding:2px 16px 8px}
  .rdiff .rdln{white-space:pre-wrap;padding:0 16px}
  .rdiff .rd-file{color:var(--accent);font-weight:600;padding-top:8px}
  .rdiff .rdcommit{padding:6px 16px;margin-top:8px;border-left:3px solid var(--line2);font-weight:600}
  .rdiff .rd-cmod{border-left-color:#d0a24a;color:#f0c88a}
  .rdiff .rd-cnew{border-left-color:var(--addln);color:var(--addfg)}
  .rdiff .rd-cdrop{border-left-color:var(--delln);color:var(--delfg)}
  .rdiff .rd-csame{color:var(--fg2)}
  table.rdtable{border-collapse:collapse;width:100%}
  table.rdtable td{padding:0 6px;white-space:pre-wrap;word-break:break-word;vertical-align:top}
  table.rdtable td.rg{width:1.3em;text-align:center;color:var(--line2);user-select:none;border-right:1px solid var(--line)}
  table.rdtable td.rg.g-add{color:var(--addfg)} table.rdtable td.rg.g-del{color:var(--delfg)}
  table.rdtable tr.rd-add td{background:var(--add)} table.rdtable tr.rd-del td{background:var(--del)}
  table.rdtable td.rc.i-add{color:var(--addfg)} table.rdtable td.rc.i-del{color:var(--delfg)} table.rdtable td.rc.i-hunk{color:var(--accent)}
  .searcherr{background:#5a1f1f;border:1px solid #7a3030;color:#f0c0c0;border-radius:6px;padding:9px 11px;font-size:12.5px;line-height:1.5}
  /* review drafts (now inside the detail overlay) */
  .draft{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
  .draftbox{width:100%;min-height:120px;resize:vertical;background:var(--bg);border:1px solid var(--line2);color:var(--fg);border-radius:6px;padding:6px 8px;font:inherit;font-size:12.5px}
  .draftbox::placeholder{color:var(--fg2)}
  .draftbtns{display:flex;gap:6px;margin-top:6px}
  .draft .posted{font-size:12px;color:var(--addfg)} .draft .posted a{color:var(--accent)}
  .req{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
  .req .repo{font-family:var(--mono);font-size:12px} .req .why{color:var(--fg2);font-size:12px;margin:4px 0 8px}
  .req button{margin-right:6px} button.ok{border-color:#2e6b45;color:var(--addfg)} button.no{border-color:#6b2e38;color:var(--delfg)}
  .empty{color:var(--fg2);font-size:12px;padding:8px 0}
  /* chat */
  .chat{margin-top:16px}
  .chathdr{display:flex;align-items:center;justify-content:space-between}
  button.btn.ghost{border-color:transparent;background:none;color:var(--fg2);padding:2px 6px;font-size:11px}
  button.btn.ghost:hover{border-color:var(--line2);color:var(--fg)}
  .chat .msgs{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}
  .msg{margin:0 0 8px;padding:7px 10px;border-radius:8px;font-size:13px;white-space:pre-wrap;line-height:1.45}
  .msg .who{font-size:9.5px;color:var(--fg2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
  .msg.user{background:#1d2a44;margin-left:22px} .msg.agent{background:var(--panel2);margin-right:22px}
  .chatbox{display:flex;gap:6px;margin-top:8px}
  .chatbox input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);color:var(--fg);border-radius:6px;padding:6px 9px;font:inherit}
  /* rendered markdown inside cards + chat */
  .md>div{margin:0 0 6px} .md>div:last-child{margin-bottom:0}
  .md code{font-family:var(--mono);font-size:.85em;background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
  .md pre.md{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;overflow-x:auto;margin:6px 0}
  .md pre.md code{border:0;background:none;padding:0;white-space:pre}
  .md ul{margin:4px 0;padding-left:18px} .md li{margin:2px 0}
  .md a{color:var(--accent)} .md strong{color:var(--fg)}
  /* landing / queue */
  .land{max-width:760px;margin:40px auto;padding:0 20px}
  .land h2{font-weight:600;margin:0 0 4px} .land p{color:var(--fg2);margin:0 0 18px}
  .qfilter{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--fg);border-radius:6px;padding:8px 11px;font:inherit;margin:0 0 12px}
  .qfilter::placeholder{color:var(--fg2)}
  .askrow{margin:10px 0;color:var(--fg2);font-size:12px} .claudepanel:not(:empty){margin:0 0 14px}
  .claudeans .prov{border:0;text-transform:none;letter-spacing:0;font-size:9px;color:var(--fg2);opacity:.85}
  .claudeans{background:var(--panel2);border:1px solid #3a4a6b;border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .claudeans .byclaude{display:inline-block;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);border:1px solid #3a4a6b;border-radius:5px;padding:0 5px;margin-bottom:6px}
  /* a picker row is a card whose title is a real link stretched over the whole card (.rowlink::after):
     the click target stays the card, while middle-click / open-in-new-tab work as on any link. The
     row's own controls (Track, ×) and its outward host link sit above the overlay via z-index. */
  .rowlink{color:inherit;text-decoration:none}
  .rowlink::after{content:"";position:absolute;inset:0;border-radius:8px}
  .extlink{position:relative;z-index:1;color:var(--fg2);text-decoration:none}
  .extlink:hover{color:var(--accent);text-decoration:underline}
  .qitem{position:relative;margin:0 0 8px;padding:11px 78px 11px 13px;border:1px solid var(--line);background:var(--panel);border-radius:8px}
  .qitem:hover{border-color:var(--accent)} .qitem .t{color:var(--fg)} .qitem .m{font-family:var(--mono);font-size:11px;color:var(--fg2);margin-top:3px}
  .qitem .track{position:absolute;right:9px;top:50%;transform:translateY(-50%);z-index:1}
  .sitem{position:relative;margin:0 0 8px;padding:11px 38px 11px 13px;border:1px solid var(--line);background:var(--panel);border-radius:8px}
  .sitem:hover{border-color:var(--accent)}
  .sitem .t{color:var(--fg)} .sitem .m{font-family:var(--mono);font-size:11px;color:var(--fg2);margin-top:3px}
  .sitem .x{position:absolute;right:9px;top:9px;z-index:1;color:var(--fg2);cursor:pointer;border:none;background:none;font-size:17px;line-height:1;padding:2px}
  .sitem .x:hover{color:var(--delfg)}
  /* review-hub: header row + per-review state chip / left-border colour */
  .hubhdr{display:flex;align-items:center;gap:10px;margin:0 0 8px} .hubhdr h2{margin:0}
  .hubago{font-size:11px;color:var(--fg2)}
  .sitem.st-merged{border-left:3px solid #a56ef0} .sitem.st-merged .ststate{color:#c9a2ef;border-color:#5a3a8a}
  .sitem.st-closed{border-left:3px solid var(--delln);opacity:.72} .sitem.st-closed .ststate{color:var(--delfg);border-color:var(--delln)}
  .sitem .ststate{font-size:10px;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line2);border-radius:5px;padding:0 5px;margin-right:6px;color:var(--fg2);white-space:nowrap}
  .sitem.st-git{border-left:3px solid var(--accent)} .sitem.st-git .ststate{color:var(--accent);border-color:#3a4a6b}
  .sitem.st-disc{border-left:3px solid #d0a24a} .sitem.st-disc .ststate{color:#f0c88a;border-color:#7a5a2a}
  .sitem.st-prog{border-left:3px solid #d0a24a} .sitem.st-prog .ststate{color:#f0c88a;border-color:#7a5a2a}
  .sitem.st-done{border-left:3px solid var(--addln)} .sitem.st-done .ststate{color:var(--addfg);border-color:#2e6b45}
  .sitem.st-new{border-left:3px solid var(--line2)}
</style>
</head>
<body>
<header>
  <span class="agent off" id="agent"><span class="dot"></span><span class="alab"></span></span>
  <a class="brand" href="/" title="back to the queue">review-mate</a>
  <button class="btn" id="t-left" title="toggle file tree">◧</button>
  <button class="btn" id="t-split" title="unified / side-by-side">⇄ split</button>
  <button class="btn" id="t-right" title="toggle context panel">◨</button>
  <button class="btn" id="t-commits" title="review per commit">⑃ commits</button>
  <span class="mr" id="mr" style="flex:1">—</span>
  <span class="tb"><input id="ref" placeholder="MR url or group/proj!iid"><button class="btn" id="load">Load</button></span>
  <span class="sid" id="status"></span>
  <span class="sid" id="sid"></span>
</header>
<div class="shell" id="shell">
  <div class="files" id="files"></div>
  <div class="diff" id="diff"></div>
  <div class="rail" id="rail"></div>
</div>
<div class="detail" id="detail" hidden></div>
<script src="app.js"></script>
</body>
</html>
