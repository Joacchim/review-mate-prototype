<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>review-mate</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --panel2:#1c2030; --line:#272b3a; --line2:#33384a; --fg:#e6e8ee;
    --fg2:#9aa3b2; --accent:#6ea8fe; --add:#10301f; --addln:#1f5135; --addfg:#9be8bf;
    --del:#34141a; --delln:#5a2230; --delfg:#f3aab4; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .brand{font-weight:600;white-space:nowrap} header .mr{color:var(--fg2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;display:inline-block}
  header .sid{color:var(--fg2);font-family:var(--mono);font-size:11px}
  .tb{display:flex;align-items:center;gap:6px}
  .tb input{background:var(--bg);border:1px solid var(--line2);color:var(--fg);border-radius:6px;padding:5px 9px;font:inherit;width:260px}
  .tb input::placeholder{color:var(--fg2)}
  button.btn{font:inherit;font-size:12.5px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);border-radius:6px;padding:5px 9px;cursor:pointer;white-space:nowrap}
  button.btn:hover{border-color:var(--accent)} button.btn.on{border-color:var(--accent);color:var(--accent)}
  .shell{display:grid;grid-template-columns:240px 1fr 360px;height:calc(100% - 47px);transition:grid-template-columns .12s}
  .shell.hl{grid-template-columns:0 1fr 360px} .shell.hr{grid-template-columns:240px 1fr 0} .shell.hl.hr{grid-template-columns:0 1fr 0}
  .files,.rail{overflow:auto;background:var(--panel)} .files{border-right:1px solid var(--line)} .rail{border-left:1px solid var(--line);padding:12px}
  .shell.hl .files,.shell.hr .rail{display:none}
  .diff{overflow:auto;padding:0 0 60px}
  /* file tree */
  .tree{padding:6px 0;font-size:13px}
  .node{display:flex;align-items:center;gap:5px;padding:3px 10px;cursor:pointer;white-space:nowrap}
  .node:hover{background:var(--panel2)}
  .node.file.on{background:var(--panel2);color:var(--accent)}
  .node .tw{display:inline-block;width:0;color:var(--fg2)}
  .node .chev{width:11px;color:var(--fg2);transition:transform .1s} .node.dir.closed .chev{transform:rotate(-90deg)}
  .node .ct{font-family:var(--mono);font-size:10px;color:var(--fg2);width:11px;text-align:center}
  .node .ct.added{color:var(--addfg)} .node .ct.deleted{color:var(--delfg)} .node .ct.renamed{color:var(--accent)}
  .children.closed{display:none}
  /* diff */
  .fname{padding:12px 16px 6px;font-family:var(--mono);font-size:12px;color:var(--fg2)}
  table.hunk{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
  table.hunk td{padding:0 8px;white-space:pre-wrap;word-break:break-word;vertical-align:top}
  td.ln{width:42px;text-align:right;color:var(--fg2);user-select:none;border-right:1px solid var(--line);background:var(--panel)}
  tr.add td.code{background:var(--add);color:var(--addfg)} tr.add td.ln{background:var(--addln)}
  tr.del td.code{background:var(--del);color:var(--delfg)} tr.del td.ln{background:var(--delln)}
  tr.hh td{color:var(--accent);background:var(--panel2)}
  tr.line td.code{cursor:pointer} tr.line:hover td.code{outline:1px solid var(--accent);outline-offset:-1px}
  tr.hl td.code{box-shadow:inset 3px 0 0 var(--accent)}
  td.gap{background:var(--bg)}
  /* split-mode cell colouring (cells carry their own classes) */
  td.code.delc{background:var(--del);color:var(--delfg)} td.ln.delln{background:var(--delln)}
  td.code.addc{background:var(--add);color:var(--addfg)} td.ln.addln{background:var(--addln)}
  td.code.hlc{box-shadow:inset 3px 0 0 var(--accent)}
  /* rail */
  .rail h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin:6px 0 8px}
  .hcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
  .hcard .loc{font-family:var(--mono);font-size:11px;color:var(--accent);margin-bottom:4px;cursor:pointer}
  .hcard .q{color:var(--fg2);font-size:12px;margin-bottom:6px}
  .hcard .card{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;white-space:pre-wrap}
  .hcard .pending{color:var(--fg2);font-style:italic;font-size:12px}
  .req{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
  .req .repo{font-family:var(--mono);font-size:12px} .req .why{color:var(--fg2);font-size:12px;margin:4px 0 8px}
  .req button{margin-right:6px} button.ok{border-color:#2e6b45;color:var(--addfg)} button.no{border-color:#6b2e38;color:var(--delfg)}
  .empty{color:var(--fg2);font-size:12px;padding:8px 0}
  /* landing / queue */
  .land{max-width:760px;margin:40px auto;padding:0 20px}
  .land h2{font-weight:600;margin:0 0 4px} .land p{color:var(--fg2);margin:0 0 18px}
  .qitem{display:block;text-align:left;width:100%;margin:0 0 8px;padding:11px 13px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer}
  .qitem:hover{border-color:var(--accent)} .qitem .t{color:var(--fg)} .qitem .m{font-family:var(--mono);font-size:11px;color:var(--fg2);margin-top:3px}
</style>
</head>
<body>
<header>
  <span class="dot"></span><span class="brand">review-mate</span>
  <button class="btn" id="t-left" title="toggle file tree">◧</button>
  <button class="btn" id="t-split" title="unified / side-by-side">⇄ split</button>
  <button class="btn" id="t-right" title="toggle context panel">◨</button>
  <span class="mr" id="mr" style="flex:1">—</span>
  <span class="tb"><input id="ref" placeholder="MR url, group/proj!iid, or blank for your queue"><button class="btn" id="load">Load</button></span>
  <span class="sid" id="sid"></span>
</header>
<div class="shell" id="shell">
  <div class="files" id="files"></div>
  <div class="diff" id="diff"></div>
  <div class="rail" id="rail"></div>
</div>
<script src="app.js"></script>
</body>
</html>
