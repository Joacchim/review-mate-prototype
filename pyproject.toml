[project]
name = "review-mate"
version = "0.1.0"
description = "A code-review companion: browse an MR diff and get Claude-assembled context on highlight."
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "mcp>=1.28.1",
]

[project.scripts]
review-mate = "review_mate.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["review_mate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient still ships on httpx 0.x; this third-party deprecation is not ours.
    "ignore:Using `httpx` with `starlette.testclient`",
]
