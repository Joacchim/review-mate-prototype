[project]
name = "review-mate"
version = "0.1.0"
description = "A code-review companion: browse an MR diff and get Claude-assembled context on highlight."
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    # capped on purpose: mcp 2.x renamed FastMCP to MCPServer and dropped the constructor
    # arguments this mounts the agent seam with. Raising it is a migration, not a bump.
    "mcp>=1.28.1,<2",
    # server-side lexing: clients receive semantic token kinds and map them to their own palette
    "pygments>=2.17",
]

[project.optional-dependencies]
# The TUI client. Kept out of the default install so running the server stays a lean dependency
# set; `uv sync --extra tui` adds it. websockets is declared here rather than borrowed from
# uvicorn[standard], which happens to ship it.
tui = [
    "prompt_toolkit>=3.0",
    "websockets>=13",
]
# The browser suite. Kept out of the default install because it pulls browser binaries;
# see docs/testing/web-ui.md.
webtest = [
    "pytest-playwright>=0.5",
]

[project.scripts]
review-mate = "review_mate.__main__:main"
review-mate-tui = "review_mate.tui.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    # also in the `tui` extra — held here so the TUI client's tests always run rather than
    # skipping out of a dev environment that happens to lack the extra
    "prompt_toolkit>=3.0",
    "websockets>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["review_mate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient still ships on httpx 0.x; this third-party deprecation is not ours.
    "ignore:Using `httpx` with `starlette.testclient`",
    # uvicorn's websocket implementation still calls the legacy websockets API — also not ours.
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
    "ignore:remove second argument of ws_handler:DeprecationWarning",
]
